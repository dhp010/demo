<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>손코딩 트레이너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f7fb;
    --surface:#ffffff;
    --surface-2:#eef1f7;
    --surface-3:#e3e7f0;
    --border:#dde2ec;
    --border-strong:#c7cee0;
    --text:#1e2433;
    --text-dim:#5f6779;
    --text-faint:#9aa2b5;
    --accent:#e08b2e;
    --accent-dim:#b8691c;
    --accent-soft:rgba(224,139,46,0.14);
    --correct:#15915b;
    --correct-soft:rgba(21,145,91,0.14);
    --wrong:#e0355f;
    --wrong-soft:rgba(224,53,95,0.13);
    --radius:10px;
    --font-ui:'IBM Plex Sans KR', 'Malgun Gothic', sans-serif;
    --font-code:'JetBrains Mono', 'Consolas', monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-ui);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent-soft); color:var(--accent); }

  button{ font-family:inherit; cursor:pointer; }
  input{ font-family:inherit; }

  *:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  /* ---------- header ---------- */
  header{
    display:flex;
    align-items:center;
    gap:24px;
    flex-wrap:wrap;
    padding:18px 28px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
    position:sticky;
    top:0;
    z-index:20;
  }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand h1{
    margin:0;
    font-size:19px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .brand h1 .mark{ color:var(--accent); font-family:var(--font-code); }
  .brand .sub{
    margin:0;
    font-size:12px;
    color:var(--text-faint);
    font-family:var(--font-code);
    letter-spacing:0.02em;
  }

  .progress-wrap{
    flex:1 1 260px;
    min-width:200px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--text-dim);
  }
  .progress-label strong{
    font-family:var(--font-code);
    color:var(--text);
    font-variant-numeric:tabular-nums;
  }
  .progress-bar{
    height:8px;
    border-radius:99px;
    background:var(--surface-2);
    border:1px solid var(--border);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--accent-dim), var(--accent));
    transition:width .3s ease;
    border-radius:99px;
  }

  .chip-btn{
    border:1px solid var(--border-strong);
    background:var(--surface-2);
    color:var(--text-dim);
    padding:9px 16px;
    border-radius:99px;
    font-size:13px;
    font-weight:600;
    white-space:nowrap;
    transition:background .15s, color .15s, border-color .15s;
  }
  .chip-btn:hover{ border-color:var(--accent-dim); color:var(--text); }
  .chip-btn.active{
    background:var(--wrong-soft);
    border-color:var(--wrong);
    color:var(--wrong);
  }

  /* ---------- tabs ---------- */
  .tabs{
    display:flex;
    gap:4px;
    padding:12px 28px 0 28px;
    overflow-x:auto;
  }
  .tab-btn{
    border:1px solid var(--border);
    border-bottom:none;
    background:var(--surface);
    color:var(--text-dim);
    padding:10px 18px;
    border-radius:8px 8px 0 0;
    font-size:13px;
    font-weight:600;
    position:relative;
    top:1px;
  }
  .tab-btn.active{
    background:var(--surface-2);
    color:var(--accent);
    border-color:var(--border-strong);
  }

  /* ---------- workbench ---------- */
  .workbench{
    display:grid;
    grid-template-columns:340px 1fr;
    gap:1px;
    background:var(--border);
    border-top:1px solid var(--border-strong);
    min-height:calc(100vh - 132px);
  }
  @media (max-width:900px){
    .workbench{ grid-template-columns:1fr; }
  }

  .sidebar{
    background:var(--surface);
    padding:14px;
    overflow-y:auto;
    max-height:calc(100vh - 133px);
  }
  @media (max-width:900px){
    .sidebar{ max-height:none; }
  }

  details.category{
    border:1px solid var(--border);
    border-radius:8px;
    margin-bottom:8px;
    background:var(--surface-2);
    overflow:hidden;
  }
  details.category[open]{ border-color:var(--border-strong); }
  details.category.hidden{ display:none; }
  summary{
    list-style:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:11px 12px;
    font-size:13px;
    font-weight:600;
    color:var(--text);
  }
  summary::-webkit-details-marker{ display:none; }
  summary::before{
    content:'▸';
    color:var(--text-faint);
    font-size:11px;
    margin-right:8px;
    transition:transform .15s;
    display:inline-block;
  }
  details[open] > summary::before{ transform:rotate(90deg); color:var(--accent); }
  .cat-name{ flex:1; }
  .cat-badge{
    font-family:var(--font-code);
    font-size:11px;
    color:var(--text-faint);
    background:var(--surface-3);
    border:1px solid var(--border);
    padding:2px 7px;
    border-radius:99px;
    font-variant-numeric:tabular-nums;
  }
  .cat-badge.full{ color:var(--correct); border-color:var(--correct); }

  .items{ padding:2px 8px 10px 8px; display:flex; flex-direction:column; gap:2px; }
  .item-btn{
    display:flex;
    align-items:center;
    gap:9px;
    text-align:left;
    border:1px solid transparent;
    background:transparent;
    color:var(--text-dim);
    padding:7px 8px;
    border-radius:6px;
    font-size:12.5px;
    line-height:1.4;
  }
  .item-btn:hover{ background:var(--surface-3); color:var(--text); }
  .item-btn.selected{ background:var(--accent-soft); color:var(--text); border-color:var(--accent-dim); }
  .item-btn.hidden{ display:none; }

  .status-dot{
    flex:none;
    width:8px; height:8px;
    border-radius:50%;
    background:var(--text-faint);
    position:relative;
  }
  .status-dot.progress{ background:var(--accent); }
  .status-dot.done{ background:var(--correct); }
  .status-dot.flagged::after{
    content:'';
    position:absolute;
    top:-3px; right:-3px;
    width:6px; height:6px;
    border-radius:50%;
    background:var(--wrong);
    border:1px solid var(--surface);
  }

  /* dictionary tab */
  .dict-search{
    width:100%;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid var(--border-strong);
    background:var(--surface-2);
    color:var(--text);
    font-size:13px;
    margin-bottom:10px;
  }
  .dict-list{ display:flex; flex-direction:column; gap:3px; }
  .dict-item{
    display:flex;
    align-items:flex-start;
    gap:9px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text-dim);
    padding:9px 10px;
    border-radius:7px;
    text-align:left;
  }
  .dict-item:hover{ border-color:var(--accent-dim); color:var(--text); }
  .dict-item.selected{ background:var(--accent-soft); color:var(--text); border-color:var(--accent-dim); }
  .dict-item .status-dot{ margin-top:4px; }
  .dict-meta{ display:flex; flex-direction:column; gap:3px; }
  .dict-tag{
    font-family:var(--font-code);
    font-size:10.5px;
    color:var(--text-faint);
    letter-spacing:0.02em;
  }
  .dict-empty{ color:var(--text-faint); font-size:13px; padding:20px 4px; text-align:center; }

  /* ---------- practice pane ---------- */
  .practice{
    background:var(--bg);
    padding:22px 26px 40px 26px;
    overflow-y:auto;
  }
  .empty-state{
    height:100%;
    min-height:300px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    color:var(--text-faint);
    text-align:center;
  }
  .empty-state .glyph{ font-size:34px; color:var(--border-strong); font-family:var(--font-code); }
  .empty-state p{ margin:0; font-size:13.5px; }

  .practice-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:16px;
    margin-bottom:18px;
  }
  .crumb{
    font-family:var(--font-code);
    font-size:11.5px;
    color:var(--text-faint);
    letter-spacing:0.02em;
    margin-bottom:4px;
  }
  .item-title{
    margin:0;
    font-size:19px;
    font-weight:700;
    text-wrap:balance;
    max-width:56ch;
  }

  .stat-row{ display:flex; align-items:center; gap:14px; }
  .stat{ display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
  .stat-label{ font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.06em; }
  .stat-value{
    font-family:var(--font-code);
    font-size:16px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    color:var(--text);
  }
  .stat-value.acc-low{ color:var(--wrong); }
  .badge-done{
    background:var(--correct-soft);
    border:1px solid var(--correct);
    color:var(--correct);
    font-size:12px;
    font-weight:700;
    padding:6px 12px;
    border-radius:99px;
    letter-spacing:0.03em;
  }

  .editor-block{ margin-bottom:16px; }
  .editor-tabbar{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:9px 9px 0 0;
    padding:9px 14px;
  }
  .editor-tabbar .dot{ width:9px; height:9px; border-radius:50%; }
  .editor-tabbar .dot.red{ background:#e0637d; }
  .editor-tabbar .dot.yellow{ background:#e8b750; }
  .editor-tabbar .dot.green{ background:#59c290; }
  .filename{
    font-family:var(--font-code);
    font-size:12px;
    color:var(--text-dim);
  }
  .submit-btn{
    margin-left:auto;
    border:1px solid var(--accent-dim);
    background:var(--accent-soft);
    color:var(--accent-dim);
    padding:6px 14px;
    border-radius:6px;
    font-size:12px;
    font-weight:700;
  }
  .submit-btn:hover{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .submit-btn:disabled{ opacity:0.5; cursor:default; background:var(--surface-3); color:var(--text-faint); border-color:var(--border-strong); }
  .retry-btn{
    border:1px solid var(--border-strong);
    background:var(--surface-3);
    color:var(--text-dim);
    padding:6px 12px;
    border-radius:6px;
    font-size:12px;
    font-weight:600;
  }
  .retry-btn:hover{ color:var(--accent); border-color:var(--accent-dim); }

  .feedback-panel{
    margin-top:10px;
    border:1px solid var(--wrong);
    background:var(--wrong-soft);
    border-radius:9px;
    padding:12px 14px;
  }
  .feedback-panel[hidden]{ display:none; }
  .feedback-title{
    margin:0 0 8px 0;
    font-size:12.5px;
    font-weight:700;
    color:var(--wrong);
  }
  .feedback-note{
    margin:8px 0 0 0;
    font-size:12px;
    color:var(--text-dim);
  }
  .feedback-code{
    margin:0;
    font-family:var(--font-code);
    font-size:13px;
    line-height:1.7;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .ch.ok{ color:var(--correct); }
  .ch.bad{ color:var(--wrong); background:var(--wrong-soft); border-radius:2px; font-weight:700; }
  .ch.extra{ color:var(--wrong); background:var(--wrong-soft); text-decoration:underline wavy var(--wrong); border-radius:2px; }

  .code-ref{
    margin:0;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:0 0 9px 9px;
    padding:14px 0;
    font-family:var(--font-code);
    font-size:13.5px;
    line-height:1.7;
    overflow-x:auto;
  }
  .code-row{ display:flex; padding:0 16px; white-space:pre; }
  .ln{
    flex:none;
    width:26px;
    color:var(--text-faint);
    user-select:none;
    text-align:right;
    margin-right:16px;
  }
  .lc{ color:var(--text); white-space:pre-wrap; word-break:break-word; }

  .type-area{
    border:1px solid var(--border-strong);
    border-radius:0 0 9px 9px;
    background:var(--surface);
    transition:border-color .2s, box-shadow .2s;
  }
  .type-area.is-complete{
    border-color:var(--correct);
    box-shadow:0 0 0 3px var(--correct-soft);
  }
  textarea.type-input{
    display:block;
    margin:0;
    padding:14px 16px;
    font-family:var(--font-code);
    font-size:13.5px;
    line-height:1.7;
    white-space:pre-wrap;
    word-break:break-word;
    width:100%;
    min-height:120px;
    border:none;
    background:transparent;
    color:var(--text);
    caret-color:var(--accent);
    resize:none;
    outline:none;
  }
  textarea.type-input:read-only{ caret-color:transparent; }

  .hint{
    margin-top:10px;
    font-size:11.5px;
    color:var(--text-faint);
    display:flex;
    gap:6px;
    align-items:center;
  }
  .hint kbd{
    font-family:var(--font-code);
    background:var(--surface-3);
    border:1px solid var(--border-strong);
    border-radius:4px;
    padding:1px 6px;
    font-size:10.5px;
    color:var(--text-dim);
  }

  .info-panel{
    border:1px solid var(--border);
    background:var(--surface);
    border-radius:9px;
    padding:14px 18px;
    margin-bottom:16px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .info-row{ display:flex; gap:14px; align-items:flex-start; }
  .info-label{
    flex:none;
    font-size:11px;
    font-weight:700;
    color:var(--accent-dim);
    background:var(--accent-soft);
    padding:3px 9px;
    border-radius:99px;
    letter-spacing:0.03em;
    margin-top:2px;
  }
  .info-formula{
    margin:0;
    font-family:var(--font-code);
    font-size:13.5px;
    color:var(--text);
    white-space:pre-wrap;
    word-break:break-word;
  }
  .info-example{
    margin:0;
    font-family:var(--font-code);
    font-size:12.5px;
    color:var(--text-dim);
    white-space:pre-wrap;
    word-break:break-word;
  }
  .info-label.usage{ color:var(--correct); background:var(--correct-soft); }
  .info-usage{
    margin:0;
    font-family:var(--font-ui);
    font-size:13px;
    line-height:1.6;
    color:var(--text);
  }

  .problem-brief{
    border:1px solid var(--border);
    background:var(--surface);
    border-radius:9px;
    padding:16px 18px;
    margin-bottom:16px;
  }
  .problem-brief .scenario{
    margin:0 0 12px 0;
    font-size:13.5px;
    line-height:1.6;
    color:var(--text-dim);
    max-width:70ch;
  }
  .table-scroll{ overflow-x:auto; margin-bottom:14px; }
  table.sample-table{
    border-collapse:collapse;
    font-family:var(--font-code);
    font-size:12px;
    min-width:100%;
  }
  table.sample-table th, table.sample-table td{
    border:1px solid var(--border);
    padding:6px 12px;
    text-align:left;
    white-space:nowrap;
  }
  table.sample-table th{
    background:var(--surface-2);
    color:var(--text-dim);
    font-weight:600;
  }
  table.sample-table td{ color:var(--text); }
  ol.steps{
    margin:0;
    padding-left:20px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  ol.steps li{
    font-size:13px;
    line-height:1.55;
    color:var(--text);
  }
  ol.steps li::marker{
    color:var(--accent);
    font-family:var(--font-code);
    font-weight:700;
  }

  /* ---------- print() 경고 배너 ---------- */
  .print-notice{
    display:flex;
    align-items:flex-start;
    gap:9px;
    border:1px solid var(--accent-dim);
    background:var(--accent-soft);
    border-radius:9px;
    padding:10px 14px;
    margin-bottom:16px;
    font-size:12.5px;
    line-height:1.55;
    color:var(--text);
  }
  .print-notice .bang{
    flex:none;
    font-weight:700;
    color:var(--accent-dim);
    font-family:var(--font-code);
  }

  /* ---------- 정답 접기 ---------- */
  .reveal-btn{
    margin-left:auto;
    border:1px solid var(--border-strong);
    background:var(--surface-3);
    color:var(--text-dim);
    padding:6px 12px;
    border-radius:6px;
    font-size:12px;
    font-weight:600;
  }
  .reveal-btn:hover{ color:var(--accent); border-color:var(--accent-dim); }
  .code-ref.masked{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:90px;
    color:var(--text-faint);
    font-size:12.5px;
    font-family:var(--font-ui);
    padding:20px;
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1><span class="mark">&gt;_</span> 손코딩 트레이너</h1>
    <p class="sub">빅데이터분석기사 실기 · Python 타이핑 연습</p>
  </div>
  <div class="progress-wrap">
    <div class="progress-label"><span>전체 진행률</span><strong id="progressText">0/0 완료</strong></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>
  <button class="chip-btn" id="wrongToggle" type="button">★ 오답노트</button>
  <button class="chip-btn" id="resetAllBtn" type="button" title="저장된 진행상황을 모두 지웁니다">↺ 전체 초기화</button>
</header>

<nav class="tabs" id="tabs"></nav>

<div class="workbench">
  <aside class="sidebar" id="sidebar"></aside>
  <section class="practice" id="practice">
    <div class="empty-state">
      <div class="glyph">{ }</div>
      <p>왼쪽 목록에서 연습할 코드를 선택하세요.</p>
    </div>
  </section>
</div>

<script>
(function(){

var DATA = [
  { key:'t1', label:'작업형1', categories:[
    { name:'★ 실기 답안 작성 규칙', items:[
      {d:'답을 화면에 출력하기(print)', c:"print(round(df['col'].mean(), 2))", example:"변수에 담기만 하면 채점되지 않는다\nans = df['col'].mean()   ← 0점\nprint(ans)               ← 정답 처리", usage:"작업형1·3은 print()로 출력된 값만 채점한다. 실기에서 답을 다 구하고도 print를 빠뜨려 0점을 받는 사고가 가장 흔하다"},
      {d:'소수 n째 자리까지 반올림해 출력', c:"print(round(df['col'].sum(), 2))", formula:"round(x, n) → 소수 n+1째 자리에서 반올림하여 소수 n째 자리까지 남김", example:"round(12.5487, 2) → 12.55\n주의: '소수 둘째 자리까지'는 round(x, 2), '소수 둘째 자리에서 반올림'은 round(x, 1)", usage:"문제의 '~자리까지'와 '~자리에서'는 서로 다른 지시다. 이 한 글자 차이로 오답 처리되므로 반드시 구분해서 읽는다"},
      {d:'정수로 변환해 출력', c:"print(int(df['col'].mean()))", example:"int(12.9) → 12 (버림, 반올림이 아님)\nround(12.9) → 13", usage:"'정수로 출력'은 보통 round() 후 int(). int()만 쓰면 무조건 버림이 되므로 문제 지시를 확인한다"},

/* ---------- build index ---------- */
var ITEM_INDEX = {};
var ALL_IDS = [];
var state = {};
/* 저장은 위치 인덱스(t1-3-2)가 아니라 내용 시그니처로 키를 잡는다.
   그래야 문제를 추가·재배치해도 기존 진행상황이 어긋나지 않는다. */
var SIG_BY_ID = {};
var ID_BY_SIG = {};

DATA.forEach(function(tab, ti){
  tab.categories.forEach(function(cat, ci){
    cat.items.forEach(function(it, ii){
      var id = tab.key + '-' + ci + '-' + ii;
      ITEM_INDEX[id] = { desc: it.d, code: it.c, tabLabel: tab.label, catName: cat.name, tabIdx: ti, catIdx: ci, scenario: it.scenario, table: it.table, steps: it.steps, formula: it.formula, example: it.example, usage: it.usage };
      ALL_IDS.push(id);
      state[id] = { typed:'', completed:false, everWrong:false, elapsedSec:0, running:false, startTs:null };
      var sig = tab.key + '|' + it.d;
      if(ID_BY_SIG[sig]) sig += '|' + ii; /* 같은 탭 안에 설명이 겹치면 순번으로 구분 */
      SIG_BY_ID[id] = sig;
      ID_BY_SIG[sig] = id;
    });
  });
});

var activeTabIdx = 0;
var currentId = null;
var wrongOnly = false;
var timerHandle = null;

var tabsEl = document.getElementById('tabs');
var sidebarEl = document.getElementById('sidebar');
var practiceEl = document.getElementById('practice');
var progressTextEl = document.getElementById('progressText');
var progressFillEl = document.getElementById('progressFill');
var wrongToggleEl = document.getElementById('wrongToggle');
var resetAllEl = document.getElementById('resetAllBtn');

/* ---------- persistence ---------- */
var STORAGE_KEY = 'bigdata-typing-trainer/v1';
var saveTimer = null;

function loadState(){
  var raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch(err){ return; }
  if(!raw) return;
  var saved = null;
  try { saved = JSON.parse(raw); } catch(err){ return; }
  if(!saved || typeof saved !== 'object' || !saved.items) return;
  Object.keys(saved.items).forEach(function(sig){
    var id = ID_BY_SIG[sig];
    if(!id || !state[id]) return; /* 문제가 삭제·수정되어 사라진 항목은 무시 */
    var s = saved.items[sig] || {};
    state[id].typed = typeof s.t === 'string' ? s.t : '';
    state[id].completed = !!s.c;
    state[id].everWrong = !!s.w;
    state[id].elapsedSec = typeof s.e === 'number' ? s.e : 0;
    state[id].running = false;
    state[id].startTs = null;
  });
  wrongOnly = !!saved.wrongOnly;
}

function saveStateNow(){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
  var items = {};
  ALL_IDS.forEach(function(id){
    var s = state[id];
    if(!s.typed && !s.completed && !s.everWrong && !s.elapsedSec) return; /* 손대지 않은 항목은 저장 생략 */
    var elapsed = s.elapsedSec + (s.running ? (Date.now() - s.startTs) / 1000 : 0);
    items[SIG_BY_ID[id]] = { t:s.typed, c:s.completed, w:s.everWrong, e:Math.round(elapsed) };
  });
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ v:1, wrongOnly:wrongOnly, items:items }));
  } catch(err){ /* 시크릿 모드 등 저장 불가여도 앱은 그대로 동작 */ }
}

function saveState(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveStateNow, 400);
}

window.addEventListener('beforeunload', saveStateNow);

/* ---------- tabs ---------- */
function renderTabs(){
  tabsEl.innerHTML = '';
  var labels = DATA.map(function(t){ return t.label; }).concat(['전체 함수 사전']);
  labels.forEach(function(label, idx){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tab-btn' + (idx === activeTabIdx ? ' active' : '');
    btn.textContent = label;
    btn.addEventListener('click', function(){
      if(activeTabIdx === idx) return;
      activeTabIdx = idx;
      deactivateCurrent();
      currentId = null;
      renderPracticeEmpty();
      renderTabs();
      renderSidebar();
    });
    tabsEl.appendChild(btn);
  });
}

function renderSidebar(){
  if(activeTabIdx < DATA.length){
    renderSidebarForTab(activeTabIdx);
  } else {
    renderDictTab();
  }
}

function renderSidebarForTab(tabIdx){
  var tab = DATA[tabIdx];
  sidebarEl.innerHTML = '';
  tab.categories.forEach(function(cat, ci){
    var catId = tab.key + '-' + ci;
    var details = document.createElement('details');
    details.className = 'category';
    details.dataset.catId = catId;

    var summary = document.createElement('summary');
    var nameSpan = document.createElement('span');
    nameSpan.className = 'cat-name';
    nameSpan.textContent = cat.name;
    var badge = document.createElement('span');
    badge.className = 'cat-badge';
    badge.id = 'catbadge-' + catId;
    summary.appendChild(nameSpan);
    summary.appendChild(badge);
    details.appendChild(summary);

    var list = document.createElement('div');
    list.className = 'items';
    cat.items.forEach(function(item, ii){
      var id = catId + '-' + ii;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'item-btn';
      btn.dataset.id = id;
      var dot = document.createElement('span');
      dot.className = 'status-dot';
      dot.id = 'dot-' + id;
      var desc = document.createElement('span');
      desc.className = 'item-desc';
      desc.textContent = item.d;
      btn.appendChild(dot);
      btn.appendChild(desc);
      btn.addEventListener('click', function(){ activateItem(id); });
      list.appendChild(btn);
    });
    details.appendChild(list);
    sidebarEl.appendChild(details);
  });
  refreshTabDots(tabIdx);
  applyWrongFilter();
}

function renderDictTab(){
  sidebarEl.innerHTML = '';
  var search = document.createElement('input');
  search.type = 'text';
  search.className = 'dict-search';
  search.placeholder = '함수/코드 검색 (예: fillna, groupby, ttest_ind)';
  search.id = 'dictSearch';
  sidebarEl.appendChild(search);
  var listEl = document.createElement('div');
  listEl.className = 'dict-list';
  listEl.id = 'dictList';
  sidebarEl.appendChild(listEl);
  search.addEventListener('input', function(){ renderDictList(search.value); });
  renderDictList('');
}

function renderDictList(query){
  var listEl = document.getElementById('dictList');
  if(!listEl) return;
  listEl.innerHTML = '';
  var q = query.trim().toLowerCase();
  var ids = ALL_IDS;
  if(wrongOnly) ids = ids.filter(function(id){ return state[id].everWrong; });
  if(q) ids = ids.filter(function(id){
    var it = ITEM_INDEX[id];
    return it.desc.toLowerCase().indexOf(q) !== -1 || it.code.toLowerCase().indexOf(q) !== -1;
  });
  if(ids.length === 0){
    var empty = document.createElement('div');
    empty.className = 'dict-empty';
    empty.textContent = '검색 결과가 없습니다.';
    listEl.appendChild(empty);
    return;
  }
  ids.forEach(function(id){
    var it = ITEM_INDEX[id];
    var row = document.createElement('button');
    row.type = 'button';
    row.className = 'dict-item';
    var dot = document.createElement('span');
    dot.className = 'status-dot';
    dot.id = 'dot-' + id;
    var meta = document.createElement('div');
    meta.className = 'dict-meta';
    var tag = document.createElement('span');
    tag.className = 'dict-tag';
    tag.textContent = it.tabLabel + ' · ' + it.catName;
    var desc = document.createElement('span');
    desc.className = 'item-desc';
    desc.textContent = it.desc;
    meta.appendChild(tag);
    meta.appendChild(desc);
    row.appendChild(dot);
    row.appendChild(meta);
    row.dataset.id = id;
    if(id === currentId) row.classList.add('selected');
    row.addEventListener('click', function(){ activateItem(id); });
    listEl.appendChild(row);
  });
  ids.forEach(updateDot);
}

/* ---------- status dots / badges / progress ---------- */
function updateDot(id){
  var dot = document.getElementById('dot-' + id);
  if(!dot) return;
  var st = state[id];
  var cls = 'status-dot';
  if(st.completed) cls += ' done';
  else if(st.typed) cls += ' progress';
  if(st.everWrong) cls += ' flagged';
  dot.className = cls;
}

function updateCatBadge(catId){
  var badge = document.getElementById('catbadge-' + catId);
  if(!badge) return;
  var ids = ALL_IDS.filter(function(id){ return id.indexOf(catId + '-') === 0; });
  var done = ids.filter(function(id){ return state[id].completed; }).length;
  badge.textContent = done + '/' + ids.length;
  badge.className = 'cat-badge' + (done === ids.length ? ' full' : '');
}

function refreshTabDots(tabIdx){
  var tab = DATA[tabIdx];
  tab.categories.forEach(function(cat, ci){
    var catId = tab.key + '-' + ci;
    cat.items.forEach(function(item, ii){ updateDot(catId + '-' + ii); });
    updateCatBadge(catId);
  });
}

function updateHeaderProgress(){
  var completed = ALL_IDS.filter(function(id){ return state[id].completed; }).length;
  progressTextEl.textContent = completed + '/' + ALL_IDS.length + ' 완료';
  progressFillEl.style.width = (ALL_IDS.length ? (completed / ALL_IDS.length * 100) : 0) + '%';
}

/* ---------- wrong-note filter ---------- */
function applyWrongFilter(){
  if(activeTabIdx >= DATA.length){
    var search = document.getElementById('dictSearch');
    renderDictList(search ? search.value : '');
    return;
  }
  var buttons = sidebarEl.querySelectorAll('.item-btn');
  buttons.forEach(function(btn){
    var id = btn.dataset.id;
    var hide = wrongOnly && !state[id].everWrong;
    btn.classList.toggle('hidden', hide);
  });
  var groups = sidebarEl.querySelectorAll('details.category');
  groups.forEach(function(det){
    var visible = det.querySelectorAll('.item-btn:not(.hidden)').length;
    det.classList.toggle('hidden', visible === 0);
  });
}

wrongToggleEl.addEventListener('click', function(){
  wrongOnly = !wrongOnly;
  wrongToggleEl.classList.toggle('active', wrongOnly);
  applyWrongFilter();
  saveState();
});

resetAllEl.addEventListener('click', function(){
  if(!window.confirm('저장된 진행상황(완료·오답노트·입력 내용)을 모두 지웁니다. 계속할까요?')) return;
  if(timerHandle){ clearInterval(timerHandle); timerHandle = null; }
  ALL_IDS.forEach(function(id){
    state[id] = { typed:'', completed:false, everWrong:false, elapsedSec:0, running:false, startTs:null };
  });
  currentId = null;
  try { localStorage.removeItem(STORAGE_KEY); } catch(err){}
  if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
  renderPracticeEmpty();
  renderSidebar();
  updateHeaderProgress();
});

/* ---------- practice pane ---------- */
function renderPracticeEmpty(){
  practiceEl.innerHTML =
    '<div class="empty-state">' +
      '<div class="glyph">{ }</div>' +
      '<p>왼쪽 목록에서 연습할 코드를 선택하세요.</p>' +
    '</div>';
}

function formatTime(sec){
  sec = Math.max(0, Math.floor(sec));
  var m = Math.floor(sec / 60);
  var s = sec % 60;
  return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
}

function normalizeNewlines(v){ return v.replace(/\r\n/g, '\n'); }

/* 채점용 정규화: 줄 끝 공백과 마지막 빈 줄은 무시한다.
   (답을 다 치고 습관적으로 Enter를 한 번 더 누르는 것만으로 오답 처리되던 문제) */
function normalizeForCompare(v){
  return normalizeNewlines(v)
    .split('\n')
    .map(function(line){ return line.replace(/[ \t]+$/, ''); })
    .join('\n')
    .replace(/\n+$/, '');
}

function startTimer(id){
  var st = state[id];
  if(st.completed) return;
  if(!st.running){ st.running = true; st.startTs = Date.now(); }
  if(timerHandle) clearInterval(timerHandle);
  timerHandle = setInterval(function(){ tick(id); }, 250);
}

function activateItem(id){
  if(currentId === id) return;
  deactivateCurrent();
  currentId = id;
  renderPracticeFor(id);
  sidebarEl.querySelectorAll('.selected').forEach(function(b){ b.classList.remove('selected'); });
  var btn = sidebarEl.querySelector('[data-id="' + id + '"]');
  if(btn){
    var det = btn.closest('details.category');
    if(det) det.open = true;
    btn.classList.add('selected');
    if(btn.scrollIntoView) btn.scrollIntoView({ block:'nearest' });
  }
}

/* Alt+↑/↓ 로 사이드바에 보이는 항목 사이를 이동 (오답노트 필터 상태를 그대로 따름) */
function visibleItemIds(){
  var nodes = sidebarEl.querySelectorAll('.item-btn:not(.hidden), .dict-item');
  return Array.prototype.filter.call(nodes, function(n){
    var det = n.closest('details.category');
    return !(det && det.classList.contains('hidden'));
  }).map(function(n){ return n.dataset.id; });
}

function gotoAdjacent(step){
  var ids = visibleItemIds();
  if(!ids.length) return;
  var i = currentId ? ids.indexOf(currentId) : -1;
  if(i === -1){ activateItem(ids[step > 0 ? 0 : ids.length - 1]); return; }
  activateItem(ids[(i + step + ids.length) % ids.length]);
}

document.addEventListener('keydown', function(e){
  if(!e.altKey || e.ctrlKey || e.metaKey) return;
  if(e.key === 'ArrowDown'){ e.preventDefault(); gotoAdjacent(1); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); gotoAdjacent(-1); }
});

function deactivateCurrent(){
  if(timerHandle){ clearInterval(timerHandle); timerHandle = null; }
  if(!currentId) return;
  var st = state[currentId];
  if(st.running){
    st.elapsedSec += (Date.now() - st.startTs) / 1000;
    st.running = false;
    st.startTs = null;
  }
}

function renderCodeRef(container, code){
  container.innerHTML = '';
  code.split('\n').forEach(function(line, i){
    var row = document.createElement('div');
    row.className = 'code-row';
    var ln = document.createElement('span');
    ln.className = 'ln';
    ln.textContent = String(i + 1);
    var lc = document.createElement('span');
    lc.className = 'lc';
    lc.textContent = line.length ? line : ' ';
    row.appendChild(ln);
    row.appendChild(lc);
    container.appendChild(row);
  });
}

function renderProblemBrief(container, it){
  container.innerHTML = '';
  var p = document.createElement('p');
  p.className = 'scenario';
  p.textContent = it.scenario;
  container.appendChild(p);

  if(it.table){
    var scroll = document.createElement('div');
    scroll.className = 'table-scroll';
    var table = document.createElement('table');
    table.className = 'sample-table';
    var thead = document.createElement('thead');
    var trh = document.createElement('tr');
    it.table.cols.forEach(function(c){
      var th = document.createElement('th');
      th.textContent = c;
      trh.appendChild(th);
    });
    thead.appendChild(trh);
    table.appendChild(thead);
    var tbody = document.createElement('tbody');
    it.table.rows.forEach(function(r){
      var tr = document.createElement('tr');
      r.forEach(function(v){
        var td = document.createElement('td');
        td.textContent = v === '' ? 'NaN' : v;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    scroll.appendChild(table);
    container.appendChild(scroll);
  }

  var ol = document.createElement('ol');
  ol.className = 'steps';
  it.steps.forEach(function(s){
    var li = document.createElement('li');
    li.textContent = s;
    ol.appendChild(li);
  });
  container.appendChild(ol);
}

function renderInfoPanel(container, it){
  container.innerHTML = '';
  if(it.usage){
    var u = document.createElement('div');
    u.className = 'info-row';
    var uLabel = document.createElement('span');
    uLabel.className = 'info-label usage';
    uLabel.textContent = '왜·언제';
    var uVal = document.createElement('p');
    uVal.className = 'info-usage';
    uVal.textContent = it.usage;
    u.appendChild(uLabel);
    u.appendChild(uVal);
    container.appendChild(u);
  }
  if(it.formula){
    var f = document.createElement('div');
    f.className = 'info-row';
    var fLabel = document.createElement('span');
    fLabel.className = 'info-label';
    fLabel.textContent = '수식';
    var fVal = document.createElement('pre');
    fVal.className = 'info-formula';
    fVal.textContent = it.formula;
    f.appendChild(fLabel);
    f.appendChild(fVal);
    container.appendChild(f);
  }
  if(it.example){
    var e = document.createElement('div');
    e.className = 'info-row';
    var eLabel = document.createElement('span');
    eLabel.className = 'info-label';
    eLabel.textContent = '예시';
    var eVal = document.createElement('pre');
    eVal.className = 'info-example';
    eVal.textContent = it.example;
    e.appendChild(eLabel);
    e.appendChild(eVal);
    container.appendChild(e);
  }
}

function renderPracticeFor(id){
  var it = ITEM_INDEX[id];
  var st = state[id];

  /* 작업형1·3은 답을 print()로 출력해야 채점된다 — 해당 항목에 상시 경고 */
  var needsPrint = it.tabIdx === 0 || it.tabIdx === 2 ||
                   (it.tabIdx === 3 && /작업형[13]/.test(it.catName));

  practiceEl.innerHTML =
    '<div class="practice-head">' +
      '<div>' +
        '<div class="crumb">' + it.tabLabel + ' / ' + it.catName + '</div>' +
        '<h2 class="item-title" id="itemTitle"></h2>' +
      '</div>' +
      '<div class="stat-row">' +
        '<div class="stat"><span class="stat-label">정확도</span><span class="stat-value" id="accVal">100%</span></div>' +
        '<div class="stat"><span class="stat-label">시간</span><span class="stat-value" id="timeVal">00:00</span></div>' +
        '<span class="badge-done" id="doneBadge" hidden>완료</span>' +
      '</div>' +
    '</div>' +
    (needsPrint ? '<div class="print-notice"><span class="bang">!</span><span>작업형1·3은 <strong>답을 print()로 출력해야</strong> 채점됩니다. 변수에 담아두기만 하면 0점입니다.</span></div>' : '') +
    ((it.formula || it.example || it.usage) ? '<div class="info-panel" id="infoPanel"></div>' : '') +
    (it.steps ? '<div class="problem-brief" id="problemBrief"></div>' : '') +
    '<div class="editor-block">' +
      '<div class="editor-tabbar"><span class="filename">내_입력.py</span><button class="submit-btn" type="button" id="submitBtn">제출</button><button class="retry-btn" type="button" id="retryBtn">&#8635; 다시 시도</button></div>' +
      '<div class="type-area" id="typeArea">' +
        '<textarea class="type-input" id="typeInput" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>' +
      '</div>' +
      '<div class="feedback-panel" id="feedback" hidden></div>' +
    '</div>' +
    '<p class="hint">들여쓰기는 <kbd>Tab</kbd>(스페이스 4칸), 제출은 <kbd>Ctrl</kbd>+<kbd>Enter</kbd>, 항목 이동은 <kbd>Alt</kbd>+<kbd>↑</kbd>/<kbd>↓</kbd>. 줄 끝 공백과 마지막 빈 줄은 채점에서 무시합니다.</p>' +
    '<div class="editor-block">' +
      '<div class="editor-tabbar"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span><span class="filename">정답.py</span><button class="reveal-btn" type="button" id="revealBtn"></button></div>' +
      '<div class="code-ref" id="codeRef"></div>' +
    '</div>';

  document.getElementById('itemTitle').textContent = it.desc;
  if(it.formula || it.example || it.usage){ renderInfoPanel(document.getElementById('infoPanel'), it); }
  if(it.steps){ renderProblemBrief(document.getElementById('problemBrief'), it); }

  /* 모의고사(steps 보유) 항목은 정답을 기본으로 숨겨 실전처럼 먼저 작성하게 한다 */
  var codeRefEl = document.getElementById('codeRef');
  var revealBtn = document.getElementById('revealBtn');
  var answerShown = !it.steps;
  function applyReveal(){
    if(answerShown){
      codeRefEl.classList.remove('masked');
      renderCodeRef(codeRefEl, it.code);
      revealBtn.textContent = '정답 숨기기';
    } else {
      codeRefEl.classList.add('masked');
      codeRefEl.textContent = '실전처럼 먼저 직접 작성해 보세요. 막히면 [정답 보기]를 누르세요.';
      revealBtn.textContent = '정답 보기';
    }
  }
  revealBtn.addEventListener('click', function(){ answerShown = !answerShown; applyReveal(); });
  applyReveal();

  var textarea = document.getElementById('typeInput');
  var submitBtn = document.getElementById('submitBtn');
  textarea.value = st.typed;
  textarea.rows = Math.max(it.code.split('\n').length + 1, 3);
  if(st.completed){
    textarea.setAttribute('readonly', '');
    document.getElementById('typeArea').classList.add('is-complete');
    document.getElementById('doneBadge').hidden = false;
    submitBtn.disabled = true;
  } else {
    textarea.focus();
  }

  updateStatsDisplay(id);

  textarea.addEventListener('input', function(e){ onInput(id, e); });
  textarea.addEventListener('keydown', function(e){ onKeydown(id, e); });
  submitBtn.addEventListener('click', function(){ onSubmit(id); });
  document.getElementById('retryBtn').addEventListener('click', function(){ resetItem(id); });

  /* 항목을 떠났다 돌아와도 타이머가 이어지도록(이전에는 여기서 영구히 멈췄다) */
  if(!st.completed && st.typed.length > 0){ startTimer(id); }
}

function updateStatsDisplay(id){
  var st = state[id];
  var it = ITEM_INDEX[id];
  var typedLen = st.typed.length;
  var correctCount = 0;
  var minLen = Math.min(typedLen, it.code.length);
  for(var i = 0; i < minLen; i++){ if(st.typed[i] === it.code[i]) correctCount++; }
  var accuracy = typedLen ? Math.round((correctCount / typedLen) * 100) : 100;
  var accEl = document.getElementById('accVal');
  if(accEl){
    accEl.textContent = accuracy + '%';
    accEl.classList.toggle('acc-low', accuracy < 90);
  }
  var timeEl = document.getElementById('timeVal');
  if(timeEl){
    var elapsed = st.elapsedSec + (st.running ? (Date.now() - st.startTs) / 1000 : 0);
    timeEl.textContent = formatTime(elapsed);
  }
}

function tick(id){ updateStatsDisplay(id); }

function onInput(id, e){
  var st = state[id];
  if(st.completed) return;
  var val = normalizeNewlines(e.target.value);

  if(val.length > 0 && !st.running){ startTimer(id); }

  st.typed = val;
  updateStatsDisplay(id);
  updateDot(id);
  saveState();

  var feedback = document.getElementById('feedback');
  if(feedback && !feedback.hidden){ feedback.hidden = true; feedback.innerHTML = ''; }
}

function onSubmit(id){
  var st = state[id];
  if(st.completed) return;
  var it = ITEM_INDEX[id];
  var val = normalizeForCompare(st.typed);
  var target = normalizeForCompare(it.code);

  if(val === target){
    completeItem(id);
    return;
  }

  var wasWrong = st.everWrong;
  st.everWrong = true;
  updateDot(id);
  if(wrongOnly && !wasWrong){ applyWrongFilter(); }
  renderFeedback(id, val, target);
  saveState();
}

function renderFeedback(id, val, target){
  var container = document.getElementById('feedback');
  if(!container) return;

  container.hidden = false;
  container.innerHTML = '';

  var title = document.createElement('p');
  title.className = 'feedback-title';
  title.textContent = '✕ 정답과 다릅니다. 틀린 부분(빨간색)을 확인하고 다시 제출하세요.';
  container.appendChild(title);

  var codeEl = document.createElement('pre');
  codeEl.className = 'feedback-code';
  for(var i = 0; i < val.length; i++){
    var span = document.createElement('span');
    span.className = 'ch';
    if(i < target.length){
      span.classList.add(val[i] === target[i] ? 'ok' : 'bad');
    } else {
      span.classList.add('extra');
    }
    span.textContent = val[i];
    codeEl.appendChild(span);
  }
  container.appendChild(codeEl);

  if(val.length < target.length){
    var note = document.createElement('p');
    note.className = 'feedback-note';
    note.textContent = '입력한 길이가 정답보다 짧습니다 (정답 ' + target.length + '자 중 ' + val.length + '자 입력).';
    container.appendChild(note);
  }
}

function idPrefix(id){
  var parts = id.split('-');
  return parts[0] + '-' + parts[1];
}

function completeItem(id){
  var st = state[id];
  st.completed = true;
  if(st.running){
    st.elapsedSec += (Date.now() - st.startTs) / 1000;
    st.running = false;
    st.startTs = null;
  }
  if(timerHandle){ clearInterval(timerHandle); timerHandle = null; }
  updateStatsDisplay(id);
  updateDot(id);
  updateCatBadge(idPrefix(id));
  updateHeaderProgress();

  var textarea = document.getElementById('typeInput');
  if(textarea) textarea.setAttribute('readonly', '');
  var typeArea = document.getElementById('typeArea');
  if(typeArea) typeArea.classList.add('is-complete');
  var doneBadge = document.getElementById('doneBadge');
  if(doneBadge) doneBadge.hidden = false;
  var submitBtn = document.getElementById('submitBtn');
  if(submitBtn) submitBtn.disabled = true;
  var feedback = document.getElementById('feedback');
  if(feedback){ feedback.hidden = true; feedback.innerHTML = ''; }
  saveStateNow();
}

function onKeydown(id, e){
  var st = state[id];
  if(st.completed) return;
  if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
    e.preventDefault();
    onSubmit(id);
    return;
  }
  if(e.key === 'Tab'){
    e.preventDefault();
    var ta = e.target;
    var start = ta.selectionStart, end = ta.selectionEnd;
    var value = ta.value;
    ta.value = value.slice(0, start) + '    ' + value.slice(end);
    ta.selectionStart = ta.selectionEnd = start + 4;
    ta.dispatchEvent(new Event('input'));
  }
}

function resetItem(id){
  var st = state[id];
  st.typed = '';
  st.completed = false;
  st.elapsedSec = 0;
  st.running = false;
  st.startTs = null;
  if(timerHandle){ clearInterval(timerHandle); timerHandle = null; }

  var textarea = document.getElementById('typeInput');
  if(textarea){
    textarea.value = '';
    textarea.removeAttribute('readonly');
    textarea.focus();
  }
  var typeArea = document.getElementById('typeArea');
  if(typeArea) typeArea.classList.remove('is-complete');
  var doneBadge = document.getElementById('doneBadge');
  if(doneBadge) doneBadge.hidden = true;
  var submitBtn = document.getElementById('submitBtn');
  if(submitBtn) submitBtn.disabled = false;
  var feedback = document.getElementById('feedback');
  if(feedback){ feedback.hidden = true; feedback.innerHTML = ''; }

  updateStatsDisplay(id);
  updateDot(id);
  updateCatBadge(idPrefix(id));
  updateHeaderProgress();
  applyWrongFilter();
  saveStateNow();
}

/* ---------- init ---------- */
loadState();
wrongToggleEl.classList.toggle('active', wrongOnly);
renderTabs();
renderSidebar();
updateHeaderProgress();

})();
</script>
</body>
