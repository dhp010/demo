<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>운동 가이드 — FitTrack</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f3ff;
      --card: #ffffff;
      --border: #e4d9ff;
      --text: #1e1040;
      --muted: #7c6fa0;
      --primary: #7c3aed;
      --radius: 14px;
      --compound: #7c3aed;
      --compound-bg: rgba(124,58,237,0.1);
      --isolation: #2563eb;
      --isolation-bg: rgba(37,99,235,0.1);
      --bodyweight: #d97706;
      --bodyweight-bg: rgba(217,119,6,0.1);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* ── 헤더 ── */
    header {
      background: linear-gradient(135deg, #7c3aed 0%, #6366f1 50%, #3b82f6 100%);
      padding: 24px 16px 20px;
      box-shadow: 0 4px 20px rgba(124,58,237,0.3);
    }

    .header-inner { max-width: 900px; margin: 0 auto; }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .header-title h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #fff;
    }

    .header-title p { font-size: 0.78rem; color: rgba(255,255,255,0.75); margin-top: 3px; }

    .back-link {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 20px;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 7px 14px;
      text-decoration: none;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .back-link:hover { background: rgba(255,255,255,0.3); }

    /* ── 검색바 ── */
    .search-wrap {
      position: relative;
      max-width: 460px;
    }

    .search-wrap input {
      width: 100%;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 24px;
      color: #fff;
      font-size: 0.9rem;
      padding: 10px 16px 10px 40px;
      outline: none;
      transition: background 0.2s;
    }

    .search-wrap input::placeholder { color: rgba(255,255,255,0.65); }
    .search-wrap input:focus { background: rgba(255,255,255,0.28); }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      pointer-events: none;
    }

    /* ── 컨테이너 ── */
    .container { max-width: 900px; margin: 0 auto; padding: 20px 16px; }

    /* ── 필터 탭 ── */
    .filter-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .filter-tab {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 22px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.83rem;
      font-weight: 600;
      padding: 8px 18px;
      transition: all 0.2s;
    }

    .filter-tab:hover { border-color: var(--primary); color: var(--primary); }

    .filter-tab.active.all      { background: linear-gradient(135deg,rgba(124,58,237,.15),rgba(99,102,241,.1)); border-color: var(--primary); color: var(--primary); }
    .filter-tab.active.compound { background: var(--compound-bg); border-color: var(--compound); color: var(--compound); }
    .filter-tab.active.isolation{ background: var(--isolation-bg); border-color: var(--isolation); color: var(--isolation); }
    .filter-tab.active.bodyweight{ background: var(--bodyweight-bg); border-color: var(--bodyweight); color: var(--bodyweight); }

    /* ── 카운트 ── */
    .result-count { font-size: 0.8rem; color: var(--muted); margin-bottom: 14px; }
    .result-count strong { color: var(--primary); }

    /* ── 그리드 ── */
    .exercise-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 16px;
    }

    /* ── 카드 ── */
    .ex-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(124,58,237,0.07);
      transition: box-shadow 0.22s, transform 0.22s;
      cursor: pointer;
    }

    .ex-card:hover { box-shadow: 0 8px 24px rgba(124,58,237,0.15); transform: translateY(-2px); }

    .ex-card-head {
      padding: 16px 16px 12px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .ex-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .ex-card.compound .ex-icon  { background: var(--compound-bg); }
    .ex-card.isolation .ex-icon { background: var(--isolation-bg); }
    .ex-card.bodyweight .ex-icon{ background: var(--bodyweight-bg); }

    .ex-head-info { flex: 1; min-width: 0; }

    .ex-name {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .ex-badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 10px;
    }

    .ex-card.compound .ex-badge  { background: var(--compound-bg); color: var(--compound); }
    .ex-card.isolation .ex-badge { background: var(--isolation-bg); color: var(--isolation); }
    .ex-card.bodyweight .ex-badge{ background: var(--bodyweight-bg); color: var(--bodyweight); }

    .ex-difficulty {
      margin-left: auto;
      font-size: 0.72rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    .stars { letter-spacing: -1px; }

    /* ── 타겟 칩 ── */
    .ex-targets {
      padding: 0 16px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .target-chip {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    /* ── 효과 ── */
    .ex-effects {
      padding: 0 16px 12px;
    }

    .ex-effects-label {
      font-size: 0.68rem;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .effect-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .effect-item {
      font-size: 0.78rem;
      color: var(--text);
      display: flex;
      align-items: flex-start;
      gap: 5px;
    }

    .effect-item::before { content: '✓'; color: #16a34a; font-weight: 700; flex-shrink: 0; }

    /* ── 토글 본문 ── */
    .ex-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease;
    }

    .ex-body.open { max-height: 600px; }

    .ex-body-inner {
      border-top: 1px solid var(--border);
      padding: 14px 16px;
      background: linear-gradient(135deg, rgba(124,58,237,0.03), rgba(99,102,241,0.02));
    }

    .steps-label {
      font-size: 0.68rem;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    .step-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }

    .step-item {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-size: 0.82rem;
      line-height: 1.5;
    }

    .step-num {
      background: var(--primary);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 800;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .ex-card.isolation .step-num { background: var(--isolation); }
    .ex-card.bodyweight .step-num { background: var(--bodyweight); }

    .tip-box {
      background: rgba(255,200,50,0.12);
      border: 1px solid rgba(217,119,6,0.25);
      border-radius: 8px;
      padding: 8px 11px;
      font-size: 0.76rem;
      color: #92400e;
      display: flex;
      gap: 6px;
    }

    /* ── 토글 버튼 ── */
    .ex-toggle-row {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      transition: color 0.2s;
    }

    .ex-card:hover .ex-toggle-row { color: var(--primary); }

    .toggle-arrow {
      font-size: 0.7rem;
      transition: transform 0.3s;
    }

    .ex-card.open .toggle-arrow { transform: rotate(180deg); }

    /* ── 빈 상태 ── */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-state .big { font-size: 3rem; margin-bottom: 10px; }

    @media (max-width: 520px) {
      .exercise-grid { grid-template-columns: 1fr; }
      .header-top { flex-direction: column; align-items: flex-start; gap: 8px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-top">

        <h1>📚 운동 가이드</h1>

    </div>

</header>

  <div class="result-count" id="result-count"></div>
  <div class="exercise-grid" id="exercise-grid"></div>
</div>

// ── 상태 ──
let currentCat = 'all';
let searchQuery = '';

// ── 렌더링 ──
function getFilteredExercises() {
  return EXERCISES.filter(ex => {
    const catMatch = currentCat === 'all' || ex.category === currentCat;
    if (!searchQuery) return catMatch;
    const q = searchQuery.toLowerCase();
    return catMatch && (
      ex.name.toLowerCase().includes(q) ||
      ex.targets.some(t => t.toLowerCase().includes(q)) ||
      ex.effects.some(e => e.toLowerCase().includes(q))
    );
  });
}

function starRating(n) {
  return '<span class="stars">' + '★'.repeat(n) + '☆'.repeat(5 - n) + '</span>';
}

function difficultyLabel(n) {
  const labels = ['', '입문', '초급', '중급', '고급', '전문가'];
  return labels[n] || '';
}

function categoryLabel(cat) {
  const map = { compound: '복합운동', isolation: '고립운동', bodyweight: '맨몸운동' };
  return map[cat];
}

function render() {
  const list = getFilteredExercises();
  const grid = document.getElementById('exercise-grid');
  const count = document.getElementById('result-count');

  count.innerHTML = `운동 <strong>${list.length}</strong>가지`;

  if (!list.length) {
    grid.innerHTML = `<div class="empty-state"><div class="big">🔍</div><p>"${searchQuery}"에 해당하는 운동을 찾지 못했습니다.</p></div>`;
    return;
  }

  grid.innerHTML = list.map((ex, idx) => `
    <div class="ex-card ${ex.category}" id="card-${idx}" onclick="toggleCard(${idx})">
      <div class="ex-card-head">
        <div class="ex-icon">${ex.icon}</div>
        <div class="ex-head-info">
          <div class="ex-name">${ex.name}</div>
          <span class="ex-badge">${categoryLabel(ex.category)}</span>
        </div>
        <div class="ex-difficulty">
          ${starRating(ex.difficulty)}<br>
          <span style="font-size:0.65rem">${difficultyLabel(ex.difficulty)}</span>
        </div>
      </div>

      <div class="ex-targets">
        ${ex.targets.map(t => `<span class="target-chip">${t}</span>`).join('')}
      </div>

      <div class="ex-effects">
        <div class="ex-effects-label">주요 효과</div>
        <div class="effect-list">
          ${ex.effects.map(e => `<div class="effect-item">${e}</div>`).join('')}
        </div>
      </div>

      <div class="ex-body" id="body-${idx}">
        <div class="ex-body-inner">
          <div class="steps-label">운동 방법</div>
          <div class="step-list">
            ${ex.steps.map((s, i) => `
              <div class="step-item">
                <span class="step-num">${i + 1}</span>
                <span>${s}</span>
              </div>`).join('')}
          </div>
          ${ex.tip ? `<div class="tip-box">💡 <span>${ex.tip}</span></div>` : ''}
        </div>
      </div>

      <div class="ex-toggle-row">
        <span id="toggle-label-${idx}">운동법 보기</span>
        <span class="toggle-arrow" id="toggle-arrow-${idx}">▼</span>
      </div>
    </div>
  `).join('');
}

function toggleCard(idx) {
  const card = document.getElementById(`card-${idx}`);
  const body = document.getElementById(`body-${idx}`);
  const label = document.getElementById(`toggle-label-${idx}`);
  const arrow = document.getElementById(`toggle-arrow-${idx}`);
  const isOpen = card.classList.toggle('open');
  body.classList.toggle('open', isOpen);
  label.textContent = isOpen ? '운동법 닫기' : '운동법 보기';
  arrow.style.transform = isOpen ? 'rotate(180deg)' : '';
}

// ── 필터 탭 ──
document.querySelectorAll('.filter-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = btn.dataset.cat;
    render();
  });
});

// ── 검색 ──
document.getElementById('search-input').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  render();
});

render();
</script>
