<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>운동 가이드 — FitTrack</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f3ff;
      --card: #ffffff;
      --border: #e4d9ff;
      --text: #1e1040;
      --muted: #7c6fa0;
      --primary: #7c3aed;
      --primary-light: #ede9fe;
      --compound: #7c3aed; --compound-bg: #ede9fe;
      --isolation: #2563eb; --isolation-bg: #dbeafe;
      --bodyweight: #d97706; --bodyweight-bg: #fef3c7;
      --radius: 12px;
    }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* ── 헤더 ── */
    header { background: linear-gradient(135deg,#7c3aed,#6366f1,#3b82f6); padding: 14px 20px; box-shadow: 0 4px 20px rgba(124,58,237,.3); flex-shrink: 0; display: flex; align-items: center; gap: 16px; }
    header h1 { font-size: 1.3rem; font-weight: 800; color: #fff; }
    header p { font-size: 0.72rem; color: rgba(255,255,255,.75); margin-top: 2px; }
    .back-link { background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.35); border-radius: 20px; color: #fff; font-size: 0.78rem; font-weight: 600; padding: 6px 14px; text-decoration: none; white-space: nowrap; margin-left: auto; }
    .back-link:hover { background: rgba(255,255,255,.3); }

    /* ── 레이아웃 ── */
    .main { display: flex; flex: 1; overflow: hidden; }

    /* ── 사이드바 ── */
    .sidebar { width: 260px; flex-shrink: 0; background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .sidebar-top { padding: 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .search-wrap { position: relative; }
    .search-wrap input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 20px; color: var(--text); font-size: 0.82rem; padding: 7px 12px 7px 32px; outline: none; }
    .search-wrap input:focus { border-color: var(--primary); }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 0.85rem; pointer-events: none; }
    .cat-tabs { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
    .cat-tab { background: var(--bg); border: 1px solid var(--border); border-radius: 14px; color: var(--muted); cursor: pointer; font-size: 0.7rem; font-weight: 600; padding: 4px 10px; transition: all .15s; }
    .cat-tab.active.all       { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
    .cat-tab.active.compound  { background: var(--compound-bg); border-color: var(--compound); color: var(--compound); }
    .cat-tab.active.isolation { background: var(--isolation-bg); border-color: var(--isolation); color: var(--isolation); }
    .cat-tab.active.bodyweight{ background: var(--bodyweight-bg); border-color: var(--bodyweight); color: var(--bodyweight); }
    .ex-list { flex: 1; overflow-y: auto; }
    .ex-list-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; transition: background .15s; }
    .ex-list-item:hover { background: var(--bg); }
    .ex-list-item.active { background: var(--primary-light); }
    .ex-list-icon { font-size: 1.2rem; flex-shrink: 0; }
    .ex-list-info { flex: 1; min-width: 0; }
    .ex-list-name { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ex-list-badge { font-size: 0.63rem; font-weight: 700; padding: 1px 7px; border-radius: 8px; display: inline-block; margin-top: 2px; }
    .badge-compound  { background: var(--compound-bg); color: var(--compound); }
    .badge-isolation { background: var(--isolation-bg); color: var(--isolation); }
    .badge-bodyweight{ background: var(--bodyweight-bg); color: var(--bodyweight); }
    .ex-count { font-size: 0.68rem; color: var(--muted); padding: 6px 14px; background: var(--bg); border-bottom: 1px solid var(--border); }

    /* ── 디테일 패널 ── */
    .detail { flex: 1; overflow-y: auto; padding: 24px; }
    .detail-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--muted); gap: 12px; }
    .detail-empty .big { font-size: 3.5rem; }
    .detail-empty p { font-size: 0.9rem; }

    /* 운동 헤더 */
    .detail-header { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    .detail-icon { width: 64px; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 2rem; flex-shrink: 0; }
    .detail-icon.compound  { background: var(--compound-bg); }
    .detail-icon.isolation { background: var(--isolation-bg); }
    .detail-icon.bodyweight{ background: var(--bodyweight-bg); }
    .detail-title { font-size: 1.6rem; font-weight: 800; margin-bottom: 6px; }
    .detail-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .detail-badge { font-size: 0.75rem; font-weight: 700; padding: 3px 12px; border-radius: 12px; }
    .detail-diff { font-size: 0.78rem; color: var(--muted); }
    .stars { color: #f59e0b; letter-spacing: -1px; }
    .stars-empty { color: #d1d5db; letter-spacing: -1px; }

    /* 섹션 */
    .section { margin-bottom: 28px; }
    .section-title { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* 타겟 칩 */
    .target-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .target-chip { font-size: 0.82rem; font-weight: 600; padding: 6px 14px; border-radius: 20px; background: var(--primary-light); color: var(--primary); border: 1px solid rgba(124,58,237,.25); }
    .target-chip.primary-muscle { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* 효과 */
    .effects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
    .effect-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; align-items: flex-start; gap: 10px; box-shadow: 0 1px 4px rgba(124,58,237,.06); }
    .effect-icon { font-size: 1.2rem; flex-shrink: 0; margin-top: 1px; }
    .effect-text { font-size: 0.83rem; font-weight: 500; line-height: 1.45; }

    /* 운동법 */
    .steps-list { display: flex; flex-direction: column; gap: 12px; }
    .step-item { display: flex; gap: 14px; align-items: flex-start; }
    .step-num { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg,#7c3aed,#4f46e5); color: #fff; font-size: 0.75rem; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
    .step-num.isolation { background: linear-gradient(135deg,#2563eb,#1d4ed8); }
    .step-num.bodyweight { background: linear-gradient(135deg,#d97706,#b45309); }
    .step-text { font-size: 0.88rem; line-height: 1.6; padding-top: 4px; }

    /* 추천 세트 */
    .sets-table { width: 100%; border-collapse: collapse; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
    .sets-table thead tr { background: linear-gradient(135deg,rgba(124,58,237,.12),rgba(99,102,241,.08)); }
    .sets-table th { padding: 10px 14px; font-size: 0.75rem; font-weight: 700; color: var(--muted); text-align: left; }
    .sets-table td { padding: 11px 14px; font-size: 0.84rem; border-top: 1px solid var(--border); }
    .sets-table tr:hover td { background: var(--bg); }
    .goal-badge { font-size: 0.72rem; font-weight: 700; padding: 2px 10px; border-radius: 10px; }
    .goal-strength  { background: rgba(220,38,38,.1); color: #dc2626; }
    .goal-hypertrophy { background: rgba(124,58,237,.1); color: var(--primary); }
    .goal-endurance { background: rgba(22,163,74,.1); color: #16a34a; }

    /* 팁 */
    .tip-box { background: linear-gradient(135deg,#fffbeb,#fef3c7); border: 1px solid #fcd34d; border-radius: 10px; padding: 14px 16px; display: flex; gap: 10px; }
    .tip-icon { font-size: 1.3rem; flex-shrink: 0; }
    .tip-text { font-size: 0.85rem; line-height: 1.6; color: #78350f; }

    /* ── 모바일 ── */
    .mobile-back { display: none; }
    @media (max-width: 680px) {
      body { overflow: auto; }
      .main { flex-direction: column; overflow: visible; height: auto; }
      .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); max-height: 50vh; }
      .detail { padding: 16px; }
      .effects-grid { grid-template-columns: 1fr; }
      .sets-table th, .sets-table td { padding: 8px 10px; font-size: 0.78rem; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>📚 운동 가이드</h1>
    <p>종목별 타겟 부위 · 효과 · 운동법 · 추천 세트</p>
  </div>
  <a class="back-link" href="/fitness">← FitTrack</a>
</header>

<div class="main">
  <!-- ── 사이드바 ── -->
  <div class="sidebar">
    <div class="sidebar-top">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="운동 검색…">
      </div>
      <div class="cat-tabs">
        <button class="cat-tab active all"       data-cat="all">전체</button>
        <button class="cat-tab compound"          data-cat="compound">🔗 복합</button>
        <button class="cat-tab isolation"         data-cat="isolation">💡 고립</button>
        <button class="cat-tab bodyweight"        data-cat="bodyweight">🤸 맨몸</button>
      </div>
    </div>
    <div class="ex-count" id="ex-count"></div>
    <div class="ex-list" id="ex-list"></div>
  </div>

  <!-- ── 디테일 ── -->
  <div class="detail" id="detail">
    <div class="detail-empty">
      <div class="big">💪</div>
      <p>왼쪽 목록에서 운동을 선택하세요</p>
    </div>
  </div>
</div>

<script>

// ── 상태 ──
let currentCat = 'all';
let searchQuery = '';
let selectedIdx = null;

const CAT_LABEL = { compound:'복합운동', isolation:'고립운동', bodyweight:'맨몸운동' };
const GOAL_CLASS = { strength:'goal-strength', hypertrophy:'goal-hypertrophy', endurance:'goal-endurance' };

function filtered() {
  return EXERCISES.map((ex, i) => ({ ex, i })).filter(({ ex }) => {
    const catOk = currentCat === 'all' || ex.cat === currentCat;
    if (!catOk) return false;
    if (!searchQuery) return true;
    const q = searchQuery.toLowerCase();
    return ex.name.toLowerCase().includes(q)
      || ex.primary.some(t => t.toLowerCase().includes(q))
      || ex.secondary.some(t => t.toLowerCase().includes(q));
  });
}

function renderList() {
  const items = filtered();
  document.getElementById('ex-count').textContent = `총 ${items.length}가지 운동`;
  document.getElementById('ex-list').innerHTML = items.map(({ ex, i }) => `
    <div class="ex-list-item${selectedIdx === i ? ' active' : ''}" onclick="selectEx(${i})">
      <div class="ex-list-icon">${ex.icon}</div>
      <div class="ex-list-info">
        <div class="ex-list-name">${ex.name}</div>
        <span class="ex-list-badge badge-${ex.cat}">${CAT_LABEL[ex.cat]}</span>
      </div>
    </div>`).join('');
}

function stars(n) {
  return `<span class="stars">${'★'.repeat(n)}</span><span class="stars-empty">${'☆'.repeat(5-n)}</span>`;
}

function selectEx(i) {
  selectedIdx = i;
  renderList();
  const ex = EXERCISES[i];
  const diffLabel = ['','입문','초급','중급','고급','전문가'][ex.diff];

  document.getElementById('detail').innerHTML = `
    <div class="detail-header">
      <div class="detail-icon ${ex.cat}">${ex.icon}</div>
      <div>
        <div class="detail-title">${ex.name}</div>
        <div class="detail-meta">
          <span class="detail-badge badge-${ex.cat}">${CAT_LABEL[ex.cat]}</span>
          <span class="detail-diff">${stars(ex.diff)} ${diffLabel}</span>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">🎯 타겟 부위</div>
      <div class="target-chips">
        ${ex.primary.map(t => `<span class="target-chip primary-muscle">⭐ ${t}</span>`).join('')}
        ${ex.secondary.map(t => `<span class="target-chip">${t}</span>`).join('')}
      </div>
    </div>

    <div class="section">
      <div class="section-title">✨ 주요 효과</div>
      <div class="effects-grid">
        ${ex.effects.map(e => `
          <div class="effect-card">
            <div class="effect-icon">${e.i}</div>
            <div class="effect-text">${e.t}</div>
          </div>`).join('')}
      </div>
    </div>

    <div class="section">
      <div class="section-title">📋 운동 방법</div>
      <div class="steps-list">
        ${ex.steps.map((s, idx) => `
          <div class="step-item">
            <div class="step-num ${ex.cat}">${idx+1}</div>
            <div class="step-text">${s}</div>
          </div>`).join('')}
      </div>
    </div>

    <div class="section">
      <div class="section-title">📊 추천 세트 & 반복 수</div>
      <table class="sets-table">
        <thead><tr>
          <th>목표</th><th>세트</th><th>반복 수</th><th>휴식</th><th>포인트</th>
        </tr></thead>
        <tbody>
          ${ex.sets.map(s => `<tr>
            <td><span class="goal-badge ${GOAL_CLASS[s.g]}">${s.goal}</span></td>
            <td><strong>${s.sets}</strong></td>
            <td>${s.reps}</td>
            <td>${s.rest}</td>
            <td style="color:var(--muted);font-size:0.78rem">${s.note}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>

    ${ex.tip ? `<div class="section">
      <div class="section-title">💡 팁 & 주의사항</div>
      <div class="tip-box">
        <div class="tip-icon">💡</div>
        <div class="tip-text">${ex.tip}</div>
      </div>
    </div>` : ''}
  `;
}

// ── 이벤트 ──
document.querySelectorAll('.cat-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = btn.dataset.cat;
    renderList();
  });
});

document.getElementById('search-input').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  renderList();
});

renderList();
// 첫 번째 운동 자동 선택
if (EXERCISES.length) selectEx(0);
</script>
